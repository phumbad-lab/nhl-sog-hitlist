name: SOG replies

# Answers messages you text the bot (a player's last name, "settings" or "help").
# cron-job.org triggers this every 2 minutes; the schedule below is only a backup,
# limited to about 8 AM - midnight Eastern (times are UTC) so it doesn't run overnight.
on:
  schedule:
    - cron: "*/10 12-23 * * *"
    - cron: "*/10 0-3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sog-replies
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Answer new messages
        run: python3 sog_hitlist.py
        env:
          REPLY: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ALL_VARS: ${{ toJSON(vars) }}

      - name: Remember which messages were answered
        run: |
          git config user.name "sog-hitlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_offset.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update reply offset"
            git pull --rebase -q origin main
            git push
          fi
