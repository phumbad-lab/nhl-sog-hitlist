name: SOG hit list

on:
  schedule:
    # Backup schedule (UTC), about 6 AM to 1 PM Eastern. cron-job.org triggers the 7:05 run.
    # The script sends one list a day (not before 7:05) plus at most one DK-prices follow-up.
    - cron: "*/30 10-17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send the hit list now, even if already sent today"
        type: boolean
        default: false
      check:
        description: "Check players instead (e.g. Stutzle, Batherson): did they make today's list, and if not, why"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: sog-hitlist
  cancel-in-progress: false

jobs:
  hitlist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Build and send the hit list
        run: python3 sog_hitlist.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ALL_VARS: ${{ toJSON(vars) }}   # every setting from the Variables tab
          FORCE: ${{ inputs.force }}
          CHECK: ${{ inputs.check }}

      - name: Save the log
        run: |
          git config user.name "sog-hitlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git add hitlist.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update hit list log"
            git push
          fi
